name: Check public API
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-live.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-check
          path: results/live-check.json
